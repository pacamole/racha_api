version: '3.8'

services:
  # ===========================================================================
  # NGINX (O Porteiro / Proxy Reverso)
  # Ele recebe a conexão na porta 80 e decide pra quem mandar
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # O Nginx não depende diretamente dos apps para subir, 
    # ele apenas redireciona o tráfego quando eles estiverem prontos.

  # ===========================================================================
  # AMBIENTE DE DESENVOLVIMENTO (DEV)
  # ===========================================================================
  
  # Banco de Dados DEV
  db_dev:
    image: postgres:16-alpine
    container_name: racha_db_dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: racha_db_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d racha_db_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API DEV
  app_dev:
    image: racha-api:dev
    container_name: racha_api_dev
    restart: always
    pull_policy: never  # Usa a imagem local (carregada via docker load)
    # Porta removida: Acessível apenas via Nginx
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      
      # --- CORREÇÕES DE DRIVER (Devido ao application-dev.properties estar como H2) ---
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      
      # --- CONEXÃO COM BANCO DEV ---
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_dev:5432/racha_db_dev
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      
      # --- VARIÁVEIS GERAIS ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_ID_SECRET=${GOOGLE_CLIENT_ID_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_BUCKET_URL=${R2_BUCKET_URL}
      
      # Update: Cria/Atualiza tabelas automaticamente
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db_dev:
        condition: service_healthy

  # ===========================================================================
  # AMBIENTE DE PRODUÇÃO (PROD)
  # ===========================================================================

  # Banco de Dados PROD
  db_prod:
    image: postgres:16-alpine
    container_name: racha_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: racha_db_prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d racha_db_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API PROD
  app_prod:
    image: racha-api:prod
    container_name: racha_api_prod
    restart: always
    pull_policy: never
    # Porta removida: Acessível apenas via Nginx
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      
      # --- CONEXÃO COM BANCO PROD ---
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_prod:5432/racha_db_prod
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      
      # --- INTEGRAÇÕES EXTERNAS ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_ID_SECRET=${GOOGLE_CLIENT_ID_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      
      # --- STORAGE (Cloudflare R2) ---
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_BUCKET_URL=${R2_BUCKET_URL}
      
      # Para produção, usar validate
      # (Mude para 'update' no primeiro deploy se o banco estiver vazio)
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db_prod:
        condition: service_healthy

# ===========================================================================
# VOLUMES PERSISTENTES
# ===========================================================================
volumes:
  postgres_data_dev:
  postgres_data_prod: