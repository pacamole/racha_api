# --- CONEXÃO COM BANCO (DOCKER) ---
spring.datasource.url=jdbc:postgresql://db:5432/racha_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- POOL DE CONEXÕES (Vital para não travar o servidor) ---
# Mantém no máximo 10 conexões abertas (suficiente p/ sua escala e leve p/ o banco)
spring.datasource.hikari.maximum-pool-size=10
# Tempo mínimo que uma conexão fica viva (performance)
spring.datasource.hikari.minimum-idle=2
# Tempo máximo de espera por uma conexão antes de dar erro (30s)
spring.datasource.hikari.connection-timeout=30000
# Nome do pool para facilitar leitura de logs
spring.datasource.hikari.pool-name=RachaHikariPool

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Mudei de 'validate' para 'update' para criar as tabelas no 1º deploy
spring.jpa.hibernate.ddl-auto=update

# Logs limpos em produção (só erros)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate=ERROR
logging.level.org.springframework=WARN

# --- PERFORMANCE (GZIP) ---
# Compacta o JSON antes de enviar para o celular
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# --- SHUTDOWN GRACIOSO ---
# Se o Docker reiniciar, espera terminar as requisições atuais antes de morrer
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s